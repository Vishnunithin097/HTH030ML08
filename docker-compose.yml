version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldstart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coldstart_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coldstart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: coldstart_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/coldstart_db
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/coldstart_db
      JWT_SECRET: production_ready_jwt_secret_change_if_needed
      JWT_ALGORITHM: HS256
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MODELS_DIR: /app/models
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coldstart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
    driver: local
